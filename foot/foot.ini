# ============================================================
# INK · foot
# Terminal casi monocromo: negro tinta / blanco papel.
# ============================================================

[main]
# Fuente Nerd Font (ttf-jetbrains-mono-nerd) con DejaVu como respaldo.
# foot deriva bold/italic solo; no hace falta declararlos.
font=JetBrainsMono Nerd Font:size=11, DejaVu Sans Mono:size=11
# "term" omitido a propósito: foot usa su propio terminfo ("foot"),
# que da mejores colores, cursor y soporte de teclas.
# En SSH a equipos sin terminfo de foot: TERM=xterm-256color ssh host
pad=16x12 center
dpi-aware=no
initial-window-size-chars=100x28

[bell]
urgent=no
notify=no

[csd]
# labwc dibuja las decoraciones (themerc), no foot.
preferred=server

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[colors-dark]
background=0a0a0a
foreground=eaeaea
selection-foreground=0a0a0a
selection-background=eaeaea

cursor=0a0a0a eaeaea

regular0=1c1c1c
regular1=8a5a5a
regular2=6f7d63
regular3=a08a5a
regular4=6b7a8f
regular5=8a748f
regular6=6e8a8a
regular7=cfcfcf

# bright0 subido de 4a4a4a a 666666: con el original, el texto gris
# (comentarios, autosugerencias) apenas se leía sobre 0a0a0a.
bright0=666666
bright1=b07a7a
bright2=93a384
bright3=c7ac78
bright4=8ea0b8
bright5=ac93b8
bright6=93b3b3
bright7=f5f5f5

jump-labels=1c1c1c eaeaea
scrollback-indicator=1c1c1c cfcfcf
search-box-no-match=eaeaea 8a5a5a
search-box-match=0a0a0a a08a5a
urls=cfcfcf

# [key-bindings] eliminado: copiar/pegar y zoom ya son esos mismos
# atajos por defecto en foot.
